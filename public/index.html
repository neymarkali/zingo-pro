<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><script src="/telegram-web-app.js"></script>
<title>ZINGO</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Barlow+Condensed:ital,wght@1,800&display=swap">
<style>
/* Layout: one phone-width column. Three tiers share the structure and swap tokens:
   FREE = deep navy + electric blue, PRO = black + gold, VIP = obsidian + diamond (iridescent ice). */
:root{
  --f-ui:'Cairo','Segoe UI',Tahoma,sans-serif;--f-logo:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
  --bg:#050a18;--bg2:#0a1428;--card:#0d1b36;--card2:#122447;--line:rgba(70,140,255,.28);--accent:#2c8cff;--accent2:#8cc6ff;
  --fg:#eaf2ff;--mute:#8fa4c4;--glow:rgba(44,140,255,.5);--ok:#46e39a;--bad:#ff6b6b;
  --btn:linear-gradient(180deg,#46a2ff,#1569e0);--btn-fg:#fff;--amb1:rgba(44,140,255,.22);--amb2:rgba(20,80,200,.18);
  color-scheme:dark;
}
:root[data-tier="pro"]{--bg:#0a0804;--bg2:#14100a;--card:#1a1409;--card2:#251c0c;--line:rgba(212,175,55,.3);--accent:#d4af37;--accent2:#f3e5ab;--fg:#f8f1de;--mute:#ab9d7c;--glow:rgba(212,175,55,.45);--btn:linear-gradient(180deg,#f0d77a,#b8922a);--btn-fg:#1a1204;--amb1:rgba(212,175,55,.2);--amb2:rgba(120,80,10,.2)}
:root[data-tier="vip"]{--bg:#03050a;--bg2:#09101c;--card:#0c1424;--card2:#142038;--line:rgba(160,230,255,.34);--accent:#8fe8ff;--accent2:#eefcff;--fg:#f2fbff;--mute:#8aa6b8;--glow:rgba(130,225,255,.55);--btn:linear-gradient(135deg,#f1fdff,#8fe8ff 48%,#b9a8ff);--btn-fg:#04141c;--amb1:rgba(140,230,255,.2);--amb2:rgba(150,120,255,.18)}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);-webkit-tap-highlight-color:transparent}
body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
#amb{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(70% 40% at 80% 0%,var(--amb1),transparent 70%),radial-gradient(60% 40% at 0% 100%,var(--amb2),transparent 70%),var(--bg)}
#amb::after{content:"";position:absolute;inset:-30%;opacity:.0;background:conic-gradient(from 0deg,transparent,rgba(255,255,255,.08),transparent 30%,rgba(255,255,255,.06),transparent 60%);animation:amb 28s linear infinite}
:root[data-tier="vip"] #amb::after{opacity:1}
@keyframes amb{to{transform:rotate(360deg)}}
#app{max-width:480px;margin:0 auto;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
.screen{animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* Header */
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:linear-gradient(var(--bg) 72%,transparent)}
.logo{font:italic 800 34px/1 var(--f-logo);letter-spacing:.02em;direction:ltr;background:linear-gradient(180deg,#fff,var(--accent2) 55%,var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px var(--glow))}
.ibtn{height:38px;min-width:38px;padding:0 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.sw{position:relative;display:flex;padding:3px;border-radius:999px;background:var(--card);border:1px solid var(--line);direction:ltr}
.sw button{position:relative;z-index:1;padding:7px 18px;border-radius:999px;font:800 14px/1 var(--f-logo);letter-spacing:.1em;color:var(--mute);transition:color .25s}
.sw button.on{color:var(--btn-fg)}
.sw i{position:absolute;top:3px;bottom:3px;width:calc(50% - 3px);border-radius:999px;background:var(--btn);box-shadow:0 0 16px var(--glow);transition:transform .35s cubic-bezier(.3,.8,.3,1);inset-inline-start:auto;left:3px}
.sw[data-v="vip"] i{transform:translateX(100%)}
/* Primitives */
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:18px;padding:14px;contain:layout paint}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}
.h2{font-weight:900;font-size:20px;margin:0}
.mute{color:var(--mute)}.sm{font-size:12.5px}
.btn{width:100%;padding:13px 16px;border-radius:14px;background:var(--btn);color:var(--btn-fg);font-weight:900;font-size:16px;box-shadow:0 6px 22px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.45);transition:transform .12s,filter .2s}
.btn:active{transform:scale(.97)}.btn:disabled{filter:grayscale(.8) brightness(.55);cursor:default;box-shadow:none}
.btn.ghost{background:var(--card);color:var(--fg);border:1px solid var(--line);box-shadow:none}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--accent2)}
/* Launcher */
.lead{text-align:center;padding:26px 0 14px}.lead .logo{font-size:64px}
.tier{position:relative;display:flex;align-items:center;gap:14px;width:100%;text-align:start;padding:18px 16px;border-radius:20px;overflow:hidden;border:1px solid var(--tl);background:linear-gradient(135deg,var(--t1),var(--t2));transition:transform .15s}
.tier:active{transform:scale(.98)}
.tier h3{margin:0;font-size:22px;font-weight:900;color:var(--tc)}.tier p{margin:2px 0 0;font-size:12.5px;color:var(--tm)}
.tier .tg{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font:800 26px/1 var(--f-logo);color:var(--tg1);background:var(--tg2);border:1px solid var(--tl)}
.tier.t-free{--tl:rgba(70,140,255,.5);--t1:#0f2a57;--t2:#0a1a38;--tc:#eaf2ff;--tm:#9fb6da;--tg1:#8cc6ff;--tg2:#0b1d3e}
.tier.t-pro{--tl:rgba(212,175,55,.55);--t1:#2a1f08;--t2:#120d04;--tc:#f6e7ae;--tm:#b9a672;--tg1:#f0d77a;--tg2:#1b1405}
.tier.t-vip{--tl:rgba(160,230,255,.6);--t1:#16263f;--t2:#080f1c;--tc:#eefcff;--tm:#9ab6c8;--tg1:#bff3ff;--tg2:#0b1626}
.tier.t-vip::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.22) 50%,transparent 65%);transform:translateX(-120%);animation:sheen 4.5s ease-in-out infinite}
@keyframes sheen{60%,100%{transform:translateX(120%)}}
/* Bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:8;padding:8px max(12px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 38%)}
.nav div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:6px;border-radius:20px;background:var(--card);border:1px solid var(--line);box-shadow:0 10px 30px -10px #000}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;border-radius:14px;color:var(--mute);font-size:12px;font-weight:700}
.nav button svg{width:22px;height:22px}
.nav button.on{background:var(--btn);color:var(--btn-fg)}
/* Round + matches */
.rb{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.cd{font:800 30px/1 var(--f-logo);letter-spacing:.06em;direction:ltr;color:var(--accent2);text-shadow:0 0 14px var(--glow)}
.prog{height:6px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:10px}.prog i{display:block;height:100%;background:var(--btn);transition:width .4s}
.m{display:flex;flex-direction:column;gap:12px}
.teams{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;text-align:center}
.team b{display:block;font-size:14px;font-weight:700;margin-top:4px}
.crest{width:56px;height:56px;margin:0 auto;display:block;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))}
.ko{font:800 24px/1 var(--f-logo);direction:ltr;color:var(--accent2)}
.mk{border-top:1px dashed var(--line);padding-top:10px}
.mk .t{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--mute);margin-bottom:7px;font-weight:700}
.opts{display:grid;gap:7px}.o2{grid-template-columns:repeat(2,1fr)}.o3{grid-template-columns:repeat(3,1fr)}
.o{position:relative;padding:10px 4px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);font-weight:800;font-size:15px;transition:transform .12s,background .2s,border-color .2s,box-shadow .2s}
.o small{display:block;font-size:11px;font-weight:700;color:var(--accent2);opacity:.85;margin-top:1px}
.o:active{transform:scale(.94)}
.o.sel{background:var(--btn);color:var(--btn-fg);border-color:transparent;box-shadow:0 0 18px var(--glow)}.o.sel small{color:var(--btn-fg)}
.o.sel::after{content:"";position:absolute;inset:0;border-radius:12px;box-shadow:0 0 0 0 var(--glow);animation:ping .5s ease-out}
@keyframes ping{to{box-shadow:0 0 0 12px transparent}}
.o:disabled{opacity:.4}.o.sel:disabled{opacity:1}
.m.saved{border-color:var(--accent)}
.stp{display:flex;align-items:center;justify-content:center;gap:14px;direction:ltr}
.stp button{width:40px;height:40px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);font-size:22px;font-weight:800}.stp b{font:800 34px/1 var(--f-logo);min-width:40px;text-align:center}
.bst{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);font-size:12px;font-weight:800;color:var(--accent2)}
.bst.on{background:var(--btn);color:var(--btn-fg);border-color:transparent;box-shadow:0 0 14px var(--glow)}
.lock{display:inline-flex;align-items:center;gap:5px;color:var(--ok);font-weight:800;font-size:13px}
/* Ranking */
.pod{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px;align-items:end;text-align:center}
.pod .c{padding:12px 4px 10px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.pod .c.r1{padding-block:18px;border-color:#d4af37;box-shadow:0 0 24px rgba(212,175,55,.3)}
.pod b{display:block;font-size:13px;margin-top:6px}.pod .pt{font:800 22px/1 var(--f-logo);color:var(--accent2)}
.medal{width:34px;height:34px;margin:6px auto 0;display:block}
.rk{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid rgba(255,255,255,.07)}
.rk .n{width:26px;text-align:center;font:800 20px/1 var(--f-logo);color:var(--mute)}
.rk.me{background:linear-gradient(90deg,transparent,var(--amb1));border-radius:12px;padding-inline:8px}
.mini{width:40px;height:40px;position:relative;flex:none;display:grid;place-items:center;border-radius:50%;background:var(--bg2);isolation:isolate}
/* Profile + frames (transform/opacity only) */
.pf{display:flex;align-items:center;gap:18px}
.av{position:relative;width:96px;height:96px;flex:none;display:grid;place-items:center;border-radius:50%;background:var(--bg2);isolation:isolate}
.av svg.em{width:78%;height:78%}
.fr{position:absolute;inset:-7px;border-radius:50%;pointer-events:none;z-index:-1;background:conic-gradient(var(--c1),var(--c2),var(--c3),var(--c2),var(--c1));-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px))}
.mini .fr{inset:-4px;-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px))}
.f-none .fr{display:none}
.f-diamond{--c1:#d8f8ff;--c2:#5cd0ff;--c3:#f5ecff;--gl:rgba(110,215,255,.6)}
.f-gold{--c1:#ffe48c;--c2:#d19a0f;--c3:#fff4c4;--gl:rgba(255,200,70,.55)}
.f-silver{--c1:#f2f5f8;--c2:#8d98a6;--c3:#ffffff;--gl:rgba(200,210,225,.5)}
.f-bronze{--c1:#f0b47c;--c2:#8c5524;--c3:#f8d3ad;--gl:rgba(220,140,80,.5)}
.f-aurora{--c1:#7dffb0;--c2:#7a6bff;--c3:#ff8ee6;--gl:rgba(140,140,255,.55)}
.f-blaze{--c1:#ffd36a;--c2:#ff4d2e;--c3:#fff0b0;--gl:rgba(255,110,50,.55)}
.anim .fr{inset:-9px;will-change:transform;animation:spin 5s linear infinite}
.mini.anim .fr{inset:-5px}
.anim::before{content:"";position:absolute;inset:-24px;border-radius:50%;z-index:-2;pointer-events:none;background:radial-gradient(circle,var(--gl) 30%,transparent 68%);will-change:transform,opacity;animation:pls 2.2s ease-in-out infinite alternate}
.mini.anim::before{inset:-10px}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pls{from{opacity:.45;transform:scale(.92)}to{opacity:1;transform:scale(1.06)}}
.lite .anim .fr,.lite .anim::before{animation:none}
.bdg{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:800;border:1px solid var(--line);color:var(--accent2)}
.bdg.vip{background:linear-gradient(135deg,rgba(241,253,255,.18),rgba(143,232,255,.12));border-color:rgba(160,230,255,.6);color:#d9f8ff}
.bdg.pro{border-color:rgba(212,175,55,.6);color:#f0d77a}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.ach{position:relative;text-align:center;padding:10px 2px;border-radius:14px;background:var(--bg2);border:1px solid var(--line);font-size:11px;line-height:1.3}
.ach .ic{width:38px;height:38px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;font-size:18px;background:var(--card2)}
.ach.lk{opacity:.45;filter:grayscale(.8)}
.ach.rare{border-color:#8fd0ff}.ach.epic{border-color:#d9a6ff}.ach.leg{border-color:#ffd76a;box-shadow:0 0 14px rgba(255,215,106,.25)}
.fgrid{display:flex;gap:12px;overflow-x:auto;padding:12px 8px 6px;scrollbar-width:none}.fgrid::-webkit-scrollbar{display:none}
.fo{flex:none;text-align:center;font-size:11px;width:68px}.fo .mini{width:52px;height:52px;margin:0 auto 6px}.fo.lk{opacity:.5}
.egrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.eo{aspect-ratio:1;border-radius:14px;background:var(--bg2);border:1px solid var(--line);display:grid;place-items:center;padding:6px;transition:transform .12s}
.eo.on{border-color:var(--accent);box-shadow:0 0 14px var(--glow);background:var(--card2)}.eo:active{transform:scale(.92)}
.eo svg{width:100%;height:100%}
/* Cinematic */
#cine{position:fixed;inset:0;z-index:50;display:none;overflow:hidden;background:#000}
#cine.on{display:block}
#cine canvas{position:absolute;inset:0;width:100%;height:100%}
#cine .fl{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#cine .tt{position:absolute;left:0;right:0;top:46%;text-align:center;font:italic 800 clamp(40px,13vw,72px)/1 var(--f-logo);letter-spacing:.08em;opacity:0;transform:scale(.8);direction:ltr}
#cine .skip{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));inset-inline-start:16px;z-index:2;padding:8px 16px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);font-weight:700;font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--card2);border:1px solid var(--accent);color:var(--accent2);padding:9px 16px;border-radius:999px;font-size:13px;font-weight:700;z-index:40;animation:rise .25s both;max-width:90vw}
.sheet{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet .p{width:100%;max-width:480px;background:var(--card);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .3s ease both}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
input.tx{width:100%;background:var(--bg2);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:16px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
/* ---- frames & progress (from zingo-frames.css) ---- */
/* ZINGO frame overlays (PRO + VIP) */
.av,.mini{position:relative}
.zf-deco{position:absolute;left:50%;top:50%;width:293%;height:293%;transform:translate(-50%,-50%);pointer-events:none;z-index:3;overflow:visible}
.zf-deco svg{width:100%;height:100%;display:block;overflow:visible}
@keyframes fSheen{to{transform:rotate(360deg)}}
@keyframes fTwinkle{0%,100%{opacity:.75}50%{opacity:1;filter:brightness(1.5)}}
@keyframes fRaySpin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.zf-deco *{animation:none!important}}

.pb{height:4px;border-radius:2px;background:rgba(255,255,255,.12);margin-top:5px;overflow:hidden}.pb i{display:block;height:100%;background:var(--btn)}
</style>
<div id="amb"></div><div id="app"></div>
<div id="cine"><canvas id="cv"></canvas><div class="fl" id="fl"></div><div class="tt" id="tt"></div><button class="skip" id="skip">تخطي</button></div>
<script>
'use strict';
document.documentElement.lang='ar';document.documentElement.dir='rtl';
try{if((navigator.hardwareConcurrency&&navigator.hardwareConcurrency<=4)||(navigator.deviceMemory&&navigator.deviceMemory<=2))document.documentElement.classList.add('lite')}catch(e){}
const TG=(window.Telegram&&window.Telegram.WebApp)||null;
try{if(TG){TG.ready();TG.expand()}}catch(e){}
const hap=(k)=>{try{TG&&TG.HapticFeedback&&(k==='ok'?TG.HapticFeedback.notificationOccurred('success'):TG.HapticFeedback.impactOccurred('light'))}catch(e){}};
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------- Original emblems (no real club logos): shield / round / hex + symbol ---------- */
const SYM={
  star:'M50 22l8 16.2 17.9 2.6-13 12.6 3.1 17.8L50 62.8l-16 8.4 3.1-17.8-13-12.6L42 38.2z',
  bolt:'M57 20L33 55h15l-6 25 25-37H51z',
  crown:'M27 68V38l14 14 9-21 9 21 14-14v30z',
  flame:'M50 20c4 14 19 20 19 39a19 19 0 0 1-38 0c0-9 4-13 9-17 0 8 4 11 7 11-5-15-1-26 3-33z',
  diamond:'M50 22l21 23-21 34-21-34z',
  wing:'M22 60c11-4 17-15 21-28 4 11 9 15 17 17-4 4-10 6-17 6 9 2 15 0 21-4-4 13-17 19-42 9z',
  moon:'M60 24a26 26 0 1 0 0 52 21 21 0 1 1 0-52z',
  orb:'M50 28a22 22 0 1 0 0 44 22 22 0 0 0 0-44zm0 9a13 13 0 1 1 0 26 13 13 0 0 1 0-26z'
};
const SHAPE={
  shield:'M50 6L88 19v32c0 22-16 36-38 44C28 87 12 73 12 51V19z',
  round:'M50 6a44 44 0 1 0 0 88 44 44 0 0 0 0-88z',
  hex:'M50 5l39 22v46L50 95 11 73V27z'
};
let _eid=0;
function emblem(e,txt){
  const id='e'+(++_eid);
  return `<svg class="em" viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${e.c1}"/><stop offset="1" stop-color="${e.c2}"/></linearGradient>
  <linearGradient id="${id}s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".38"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
  <path d="${SHAPE[e.sh]}" fill="url(#${id})" stroke="${e.c3}" stroke-width="3.2"/><path d="${SHAPE[e.sh]}" fill="url(#${id}s)"/>
  ${txt?`<text x="50" y="60" text-anchor="middle" font-family="Barlow Condensed,Arial" font-style="italic" font-weight="800" font-size="30" fill="${e.c3}">${txt}</text>`:`<path d="${SYM[e.sym]}" fill="${e.c3}" opacity=".95"/>`}</svg>`;
}
const EMBLEMS=[
