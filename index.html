<script>
/* ===== ZINGO VIP ACHIEVEMENTS REAL INTERACTION ===== */
(function(){

  function initZingoAchievementCards(){

    const grid=document.getElementById("vipAchievementGrid");

    if(!grid) return;

    const cards=grid.querySelectorAll(":scope > .vipAchievement");

    cards.forEach(function(card){

      if(card.dataset.zingoBound==="1") return;

      card.dataset.zingoBound="1";

      card.addEventListener("click",function(){

        const opened=card.classList.contains("open");

        cards.forEach(function(c){
          c.classList.remove("open");
        });

        if(!opened){
          card.classList.add("open");
        }

      });

    });

  }

  if(document.readyState==="loading"){
    document.addEventListener(
      "DOMContentLoaded",
      initZingoAchievementCards
    );
  }else{
    initZingoAchievementCards();
  }

})();
</script>

<script>
/* ===== ZINGO VIP ACHIEVEMENTS REAL INTERACTION ===== */
(function(){
  function initZingoAchievementCards(){
    const grid=document.getElementById("vipAchievementGrid");
    if(!grid) return;

    const cards=grid.querySelectorAll(":scope > .vipAchievement");

    cards.forEach(function(card){
      if(card.dataset.zingoBound==="1") return;
      card.dataset.zingoBound="1";

      card.addEventListener("click",function(){
        const opened=card.classList.contains("open");
        cards.forEach(function(c){c.classList.remove("open");});
        if(!opened) card.classList.add("open");
      });
    });
  }

  if(document.readyState==="loading"){
    document.addEventListener("DOMContentLoaded",initZingoAchievementCards);
  }else{
    initZingoAchievementCards();
  }
})();
</script>
