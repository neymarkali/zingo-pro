<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
(() => {
  "use strict";

  const tg = window.Telegram?.WebApp || null;

  if (tg) {
    try {
      tg.ready();
      tg.expand();
      tg.setHeaderColor("#05070b");
      tg.setBackgroundColor("#05070b");
    } catch(e){}
  }

  const state = {
    mode: "free",
    page: "home",
    user: null,
    subscription: null,
    round: null,
    ranking: null,
    selections: {},
    saved: false,
    loading: true
  };

  // Shared state bridge for profile functions defined outside this IIFE.
  window.__zingoState = state;

  const API = {
    subscription: "/api/subscription",
    round: "/api/pro_round",
    submit: "/api/pro_submit",
    ranking: "/api/pro_ranking"
  };

  function authHeaders(){
    const initData = tg?.initData || "";
    return initData ? {"X-Telegram-Init-Data": initData} : {};
  }

  async function api(path, options={}){
    const headers = {
      ...(options.body ? {"Content-Type":"application/json"} : {}),
      ...authHeaders(),
      ...(options.headers || {})
    };

    const res = await fetch(path,{...options,headers});
    const text = await res.text();

    let data;
    try { data = JSON.parse(text); }
    catch { data = {raw:text}; }

    if(!res.ok) throw new Error(data?.error || data?.message || `HTTP ${res.status}`);
    return data;
  }

  function esc(v){
    return String(v ?? "").replace(/[&<>"']/g,m=>({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
    }[m]));
  }

  function toast(message){
    const el=document.getElementById("toast");
    el.textContent=message;
    el.classList.add("show");
    clearTimeout(window.__toast);
    window.__toast=setTimeout(()=>el.classList.remove("show"),2200);
  }

  function userId(){
    return state.user?.id || tg?.initDataUnsafe?.user?.id || "";
  }

  function userName(){
    const u=state.user || tg?.initDataUnsafe?.user;
    if(!u) return "PLAYER";
    return u.first_name || u.username || "PLAYER";
  }

  function formatRound(){
    const r=state.round;
    if(!r) return [];
    if(Array.isArray(r)) return r;
    return r.matches || r.fixtures || r.games || r.data || r.round?.matches || [];
  }

  function nav(items){
    const ar=true;
    const labels={
      home:ar?"الرئيسية":"Home",
      matches:ar?"المباريات":"Matches",
      predict:ar?"التوقعات":"Predictions",
      stats:ar?"الإحصائيات":"Stats",
      profile:ar?"الملف الشخصي":"Profile",
      analysis:ar?"التحليل":"Analysis",
      rewards:ar?"المكافآت":"Rewards"
    };

    return `
      <nav class="bottom-nav">
        ${items.map(x=>`
          <button
            type="button"
            class="nav-btn ${state.page===x.id?"active":""}"
            data-route="${x.id}"
            onclick="event.preventDefault();window.Zingo.go(this.dataset.route);return false"
          >
            <span class="nav-icon">${x.icon}</span>${labels[x.id]||x.label}
          </button>
        `).join("")}
      </nav>`;
  }

  function shell(content){
    const vip=state.mode==="vip";
    document.body.classList.toggle("vip-world",vip);

    return `
      <div class="topbar">
        <div class="topbar-inner">
          <div class="brand">
            <div class="logo">Z</div>
            <div>
              <div class="brand-title">ZINGO</div>
              <div class="brand-sub">${vip?"BLACK DIAMOND":"AAA ESPORTS COMMAND CENTER"}</div>
            </div>
          </div>

          <div class="mode-switch">
            <button class="mode-btn ${!vip?"active pro":""}" onclick="window.Zingo.setMode('pro')">PRO</button>
            <button class="mode-btn ${vip?"active vip":""}" onclick="window.Zingo.setMode('vip')">VIP</button>
          </div>
        </div>
      </div>

      <main class="page">${content}</main>

      ${nav(vip ? [
        {id:"home",icon:"◆",label:"الرئيسية"},
        {id:"predict",icon:"⌁",label:"التوقعات"},
        {id:"analysis",icon:"◈",label:"التحليل"},
        {id:"rewards",icon:"♛",label:"المكافآت"},
        {id:"profile",icon:"◇",label:"الملف الشخصي"}
      ] : [
        {id:"home",icon:"⌂",label:"الرئيسية"},
        {id:"matches",icon:"◉",label:"المباريات"},
        {id:"predict",icon:"⌁",label:"التوقعات"},
        {id:"stats",icon:"▦",label:"الإحصائيات"},
        {id:"profile",icon:"◇",label:"الملف الشخصي"}
      ])}
    `;
  }

  function home(){
    const vip=state.mode==="vip";
    const matches=formatRound().slice(0,3);

    return shell(`
      <div class="page-head">
        <div>
          <div class="eyebrow">${vip?"مركز VIP":"مركز اللعب"}</div>
          <h1>${vip?"أهلًا بك في VIP":"أهلًا بعودتك"}</h1>
        </div>
      </div>

      <section class="card hero">
        <div class="hero-kicker">${vip?"ULTRA EXCLUSIVE / VIP":"AAA ESPORTS / PRO"}</div>
        <div class="hero-title">${vip?"مساحتك الخاصة للتوقعات.":"لعبتك. ترتيبك. توقعك."}</div>
        <div class="hero-text">
          ${vip
            ?"A living VIP environment built around your predictions, analysis, royal rank and exclusive rewards."
            :"Track matches, make predictions, earn النقاط and climb the championship system."}
        </div>
        <div class="rank-line">
          <div class="rank-badge">${vip?"BLACK DIAMOND":"ترتيب PRO"} · ${userName()}</div>
        </div>
      </section>

      <div class="grid">
        <div class="card stat"><div class="stat-label">الترتيب</div><div class="stat-value">${vip?"ROYAL":"PRO"}</div><div class="stat-small">التصنيف الحالي</div></div>
        <div class="card stat"><div class="stat-label">النقاط</div><div class="stat-value">${state.ranking?.xp ?? "—"}</div><div class="stat-small">Season progress</div></div>
        <div class="card stat"><div class="stat-label">Predictions</div><div class="stat-value">${state.ranking?.predictions ?? "—"}</div><div class="stat-small">Total saved</div></div>
        <div class="card stat"><div class="stat-label">${vip?"Royal":"Championship"}</div><div class="stat-value">${state.ranking?.rank ?? "—"}</div><div class="stat-small">Leaderboard</div></div>
      </div>

      <section class="section">
        <div class="section-title"><h2>${vip?"Live Cockpit":"Match Center"}</h2><span>${matches.length} ACTIVE</span></div>
        ${matches.length ? matches.map(matchCard).join("") : `<div class="empty">No active matches available right now.</div>`}
      </section>

      <section class="section">
        <div class="grid">
          <button class="card card-pad secondary" onclick="event.preventDefault();event.stopPropagation();window.Zingo.go(\'predict\');return false">${vip?"OPEN COCKPIT":"ضع توقعك"}</button>
          <button class="card card-pad secondary" onclick="event.preventDefault();event.stopPropagation();window.Zingo.go(\'${vip?"rewards":"stats"}\');return false">${vip?"ROYAL المكافآت":"عرض الإحصائيات"}</button>
        </div>
      </section>
    `);
  }

  function matchCard(m){
    const home=m.home_team || m.home || m.team1 || m.homeTeam || "صاحب الأرض";
    const away=m.away_team || m.away || m.team2 || m.awayTeam || "الضيف";
    const status=m.status || m.state || "UPCOMING";
    const id=m.id || m.match_id || m.fixture_id || "";
    return `
      <div class="card match">
        <div class="match-main">
          <div class="match-teams">${esc(home)} <span class="muted">vs</span> ${esc(away)}</div>
          <div class="match-meta"><span class="${/live|playing/i.test(status)?"live-dot":""}"></span>${esc(status)} ${id?`· #${esc(id)}`:""}</div>
        </div>
        <button class="match-action" onclick="window.Zingo.selectMatch('${esc(id)}')">توقعاتي</button>
      </div>`;
  }

  function matchesPage(){
    const matches=formatRound();
    return shell(`
      <div class="page-head"><div><div class="eyebrow">PRO مركز المباريات</div><h1>Matches</h1></div></div>
      <div class="section">
        ${matches.length ? matches.map(matchCard).join("") : `<div class="empty">No matches available.</div>`}
      </div>
    `);
  }

  function predict(){
    const matches=formatRound();
    const m=matches[0] || {};
    const matchId=m.id || m.match_id || m.fixture_id || "current";

    return shell(`
      <div class="page-head">
        <div><div class="eyebrow">${state.mode==="vip"?"VIP PREDICTION COCKPIT":"PRO التوقعات"}</div><h1>${state.mode==="vip"?"Cockpit":"Make your call"}</h1></div>
      </div>

      <div class="card card-pad" style="margin-bottom:12px">
        <div class="eyebrow">مباراة نشطة</div>
        <h2 style="margin-top:7px">${esc(m.home_team || m.home || m.team1 || "Home")} <span class="muted">vs</span> ${esc(m.away_team || m.away || m.team2 || "Away")}</h2>
        <div class="muted" style="font-size:11px">${esc(m.status || "UPCOMING")}</div>
      </div>

      ${market("الفائز","winner",["صاحب الأرض","تعادل","الضيف"])}
      ${market("الأهداف","goals",["OVER 1.5","UNDER 1.5","OVER 2.5","UNDER 2.5"])}
      ${market("النتيجة","score",["1-0","2-0","2-1","1-1","0-0","0-1"])}

      <button class="primary save ${Object.keys(state.selections).length?"ready":""}" onclick="window.Zingo.savePrediction('${esc(matchId)}')">
        ${state.saved?"✓ تم حفظ التوقع":"حفظ التوقع"}
      </button>

      <div class="section card card-pad">
        <div class="eyebrow">القواعد</div>
        <div style="font-size:11px;line-height:1.7;color:#aeb8c9;margin-top:8px">
          Select your prediction for each market, then save it before the prediction window closes.
          Each prediction is stored individually. Results become visible after the match is settled.
        </div>
      </div>
    `);
  }

  function market(title,key,options){
    return `
      <div class="market" style="margin-bottom:10px">
        <div class="market-title">${title}</div>
        <div class="options">
          ${options.map(o=>`
            <button class="option ${state.selections[key]===o?"selected":""}"
              onclick="window.Zingo.pick('${key}','${o}')">${o}</button>
          `).join("")}
        </div>
      </div>`;
  }

  function stats(){
    return shell(`
      <div class="page-head"><div><div class="eyebrow">PLAYER HUB</div><h1>Stats</h1></div></div>
      <div class="grid">
        <div class="card stat"><div class="stat-label">Accuracy</div><div class="stat-value">—</div><div class="stat-small">Awaiting settled data</div></div>
        <div class="card stat"><div class="stat-label">Wins</div><div class="stat-value">—</div><div class="stat-small">Season</div></div>
        <div class="card stat"><div class="stat-label">النقاط</div><div class="stat-value">${state.ranking?.xp ?? "—"}</div><div class="stat-small">Progress</div></div>
        <div class="card stat"><div class="stat-label">الترتيب</div><div class="stat-value">${state.ranking?.rank ?? "—"}</div><div class="stat-small">Leaderboard</div></div>
      </div>
      <div class="section card card-pad">
        <div class="section-title"><h2>Season Progress</h2><span>ACTIVE</span></div>
        <div class="progress"><i></i></div>
      </div>
    `);
  }

  function analysis(){
    return shell(`
      <div class="page-head"><div><div class="eyebrow">BLACK DIAMOND</div><h1>Analysis Center</h1></div></div>
      <div class="card hero">
        <div class="hero-kicker">ADVANCED التحليل</div>
        <div class="hero-title">Private intelligence layer.</div>
        <div class="hero-text">This is the dedicated VIP architecture layer for advanced match intelligence, deeper statistics and future analysis modules.</div>
      </div>
      <div class="grid">
        ${["Momentum Engine","Team Form","Goal Patterns","Market Intelligence"].map(x=>`
          <div class="card card-pad">
            <div class="eyebrow">VIP MODULE</div>
            <h2 style="margin-top:7px">${x}</h2>
            <div class="muted" style="font-size:11px">Module architecture ready for live data.</div>
          </div>`).join("")}
      </div>
    `);
  }

  function rewards(){
    return shell(`
      <div class="page-head"><div><div class="eyebrow">${state.mode==="vip"?"ROYAL المكافآت":"المكافآت SYSTEM"}</div><h1>${state.mode==="vip"?"Royal Vault":"Rewards"}</h1></div></div>
      <div class="card hero">
        <div class="hero-kicker">${state.mode==="vip"?"BLACK DIAMOND":"PRO"}</div>
        <div class="hero-title">${state.mode==="vip"?"Exclusive rewards await.":"Build your reward profile."}</div>
        <div class="hero-text">Points, badges, rank progression and future reward modules live here.</div>
      </div>
      <div class="grid">
        ${["الترتيب","Badges","Points","Achievements"].map(x=>`
          <div class="card stat"><div class="stat-label">${x}</div><div class="stat-value">—</div><div class="stat-small">System ready</div></div>`).join("")}
      </div>
    `);
  }


function profile(){
  const zState=window.__zingoState || {};
  const u=
    zState.user
    || window.__zingoTelegramUser
    || window.Telegram?.WebApp?.initDataUnsafe?.user
    || {};

  const p=window.__zingoProfile || {};

  const escProfile=(v)=>{
    return String(v ?? "").replace(/[&<>"']/g,m=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[m]));
  };

  const mode=String(
    window.__zingoMode
    || zState.mode
    || (document.body.classList.contains("vip-world") ? "vip" : "pro")
  ).toLowerCase();

  const subscription=
    window.__zingoSubscription
    || zState.subscription
    || {};

  const club=
    p.club_id &&
    typeof window.zingoClubById==="function"
      ? window.zingoClubById(p.club_id)
      : null;

  const profileCardHtml=
    typeof window.zingoProfileCard==="function"
      ? window.zingoProfileCard()
      : `
        <div class="card card-pad">

          <div class="eyebrow">
            TELEGRAM IDENTITY
          </div>

          <h2 style="margin-top:8px">
            ${escProfile(
              p.display_name
              || u.first_name
              || "Player"
            )}
          </h2>

          ${
            club
              ? `<div class="muted">${escProfile(club[1])}</div>`
              : ""
          }

        </div>
      `;

  const plan=
    subscription?.plan
    || subscription?.subscription?.plan
    || "PRO";

  return `
    <div class="page">

      <div class="page-head">
        <div>
          <div class="eyebrow">PLAYER HUB</div>

          <h1>
            ${escProfile(
              p.display_name
              || u.first_name
              || "Player"
            )}
          </h1>
        </div>
      </div>

      ${profileCardHtml}

      <div class="section grid">

        <div class="card stat">
          <div class="stat-label">Mode</div>

          <div class="stat-value">
            ${escProfile(mode.toUpperCase())}
          </div>
        </div>

        <div class="card stat">
          <div class="stat-label">Access</div>

          <div class="stat-value">
            ${escProfile(String(plan).toUpperCase())}
          </div>
        </div>

      </div>

    </div>
  `;
}

function render(){
    let content;
    if(state.mode==="vip"){
      if(state.page==="predict") content=predict();
      else if(state.page==="analysis") content=analysis();
      else if(state.page==="rewards") content=rewards();
      else if(state.page==="profile" || state.page==="player") content=profile();
      else content=home();
    }else{
      if(state.page==="matches") content=matchesPage();
      else if(state.page==="predict") content=predict();
      else if(state.page==="stats") content=stats();
      else if(state.page==="profile" || state.page==="player") content=profile();
      else content=home();
    }

    document.getElementById("app").innerHTML=content;
  }

  async function loadData(){
    state.loading=true;
    render();

    try{
      const sub=await api(API.subscription);
      state.subscription=sub?.subscription || sub;
    }catch(e){
      console.warn("subscription:",e.message);
    }

    try{
      state.round=await api(API.round);
    }catch(e){
      console.warn("round:",e.message);
    }

    try{
      state.ranking=await api(API.ranking);
    }catch(e){
      console.warn("ranking:",e.message);
    }

    state.user=tg?.initDataUnsafe?.user || null;

    // Player Identity is part of normal app state.
    // Failure must never block the application.
    try{
      await loadZingoProfile();
    }catch(e){
      console.warn("player profile:",e.message);
    }

    state.loading=false;
    render();
  }

  function pick(key,value){
    state.selections[key]=value;
    state.saved=false;
    render();
  }

  async function savePrediction(matchId){
    if(!Object.keys(state.selections).length){
      toast("اختر توقعاً أولاً");
      return;
    }

    try{
      const body={
        match_id:matchId,
        predictions:{...state.selections},
        prediction:{...state.selections}
      };

      await api(API.submit,{
        method:"POST",
        body:JSON.stringify(body)
      });

      state.saved=true;
      render();
      toast("تم حفظ التوقع");
    }catch(e){
      console.error(e);
      toast(e.message || "تعذر حفظ التوقع");
    }
  }

  function selectMatch(id){
    state.page="predict";
    state.selections={};
    state.saved=false;
    render();
    window.scrollTo({top:0,behavior:"smooth"});
  }

  let ascensionTimer;

  function startAscension(){
    const el=document.getElementById("ascension");
    if(!el) return;

    const p=document.getElementById("particles");
    p.innerHTML="";
    for(let i=0;i<42;i++){
      const x=document.createElement("i");
      x.className="particle";
      x.style.left=(Math.random()*100)+"%";
      x.style.setProperty("--x",(Math.random()*180-90)+"vw");
      x.style.animationDuration=(2.2+Math.random()*3.5)+"s";
      x.style.animationDelay=(Math.random()*1.8)+"s";
      p.appendChild(x);
    }

    el.classList.add("show");
    clearTimeout(ascensionTimer);
    ascensionTimer=setTimeout(finishAscension,5200);
  }

  function finishAscension(){
    clearTimeout(ascensionTimer);
    document.getElementById("ascension")?.classList.remove("show");
    state.mode="vip";
    state.page="home";
    render();
    try{
      if(tg?.HapticFeedback) tg.HapticFeedback.impactOccurred("heavy");
    }catch(e){}
  }




window.Zingo={
  go(page){
    if(page==="player") page="profile";
    state.page=page;

    try{
      if(page==="settings" && typeof window.zingoSettings==="function"){
        window.zingoSettings();
      }else{
        render();
      }
    }catch(error){
      console.error("ZINGO ROUTE ERROR:",error);

      try{
        if(page==="profile" && typeof profile==="function"){
          document.getElementById("app").innerHTML=profile();
        }
      }catch(profileError){
        console.error("ZINGO PROFILE ERROR:",profileError);
      }
    }

    window.scrollTo({top:0,behavior:"smooth"});
  },

  pick,

  savePrediction,

  selectMatch,

  async setMode(mode){
    mode=String(mode||"free").toLowerCase();

    if(mode==="free"){
      state.mode="free";
      state.page="home";
      render();
      return;
    }

    if(mode==="vip"){
      let allowed=false;

      try{
        allowed =
          window.ZingoMaster &&
          await window.ZingoMaster.canUse("vip");
      }catch(e){
        console.warn("VIP access:",e);
      }

      if(!allowed){
        toast("🔒 VIP غير مفعّل حاليًا");
        return;
      }

      if(typeof startAscension==="function"){
        startAscension();
      }else{
        state.mode="vip";
        state.page="home";
        render();
      }

      return;
    }

    let allowed=false;

    try{
      allowed =
        window.ZingoMaster &&
        await window.ZingoMaster.canUse("pro");
    }catch(e){
      console.warn("PRO access:",e);
    }

    if(!allowed){
      toast("🔒 PRO غير مفعّل حاليًا");
      return;
    }

    state.mode="pro";
    state.page="home";
    render();
  }
};

window.__zingoLoadData = loadData;
})();
</script>

  const originals = new WeakMap();

  function clean(v){
    return v.replace(/\s+/g," ").trim();
  }

  function translateText(text, lang){
    const key = clean(text);
    if(!key || KEEP.has(key)) return null;

    if(lang === "ar"){
      return dict[key] || null;
    }

    return null;
  }

  function shouldSkip(el){
    if(!el || !el.parentElement) return true;

    const tag = el.parentElement.tagName;

    return [
      "SCRIPT",
      "STYLE",
      "NOSCRIPT",
      "TEXTAREA",
      "INPUT"
    ].includes(tag);
  }

  function capture(root=document.body){
    if(!root) return;

    const walker = document.createTreeWalker(
      root,
      NodeFilter.SHOW_TEXT
    );

    const nodes=[];

    while(walker.nextNode()){
      const n=walker.currentNode;
      if(!shouldSkip(n)) nodes.push(n);
    }

    nodes.forEach(n=>{
      if(!originals.has(n)){
        originals.set(n,n.nodeValue);
      }
    });
  }

  function apply(lang){
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";

    capture();

    document.querySelectorAll(
      "script,style"
    ).forEach(()=>{});

    const walker = document.createTreeWalker(
      document.body,
      NodeFilter.SHOW_TEXT
    );

    const nodes=[];

    while(walker.nextNode()){
      const n=walker.currentNode;
      if(!shouldSkip(n)) nodes.push(n);
    }

    nodes.forEach(n=>{
      const original=originals.get(n);
      if(original == null) return;

      const key=clean(original);

      if(lang === "en"){
        n.nodeValue=original;
        return;
      }

      const translated=translateText(original,lang);

      if(translated){
        n.nodeValue=original.replace(key,translated);
      }
    });

    document.querySelectorAll("[placeholder]").forEach(el=>{
      if(!el.dataset.zingoOriginalPlaceholder){
        el.dataset.zingoOriginalPlaceholder=el.getAttribute("placeholder") || "";
      }

      const original=el.dataset.zingoOriginalPlaceholder;
      const translated=lang==="ar" ? translateText(original,lang) : null;

      el.setAttribute(
        "placeholder",
        translated || original
      );
    });

    document.querySelectorAll("[aria-label]").forEach(el=>{

      if(!el.dataset.zingoOriginalAria){
        el.dataset.zingoOriginalAria=el.getAttribute("aria-label") || "";
      }

      const original=el.dataset.zingoOriginalAria;
      const translated=lang==="ar" ? translateText(original,lang) : null;

      if(translated){
        el.setAttribute("aria-label",translated);
      }else if(lang==="en"){
        el.setAttribute("aria-label",original);
      }
    });

    document.querySelectorAll(
      "#zingoLangAR,#zingoLangEN"
    ).forEach(b=>b.classList.remove("active"));

    document
      .getElementById(lang==="ar" ? "zingoLangAR" : "zingoLangEN")
      ?.classList.add("active");

    document.body.classList.remove("zingo-i18n-fade");
    void document.body.offsetWidth;
    document.body.classList.add("zingo-i18n-fade");

    localStorage.setItem("zingo_language",lang);

    window.dispatchEvent(
      new CustomEvent("zingo:language-change",{
        detail:{language:lang}
      })
    );
  }

  function init(){

    capture();

    const saved=localStorage.getItem("zingo_language") || "ar";

    document
      .getElementById("zingoLangAR")
      ?.addEventListener("click",()=>apply("ar"));

    document
      .getElementById("zingoLangEN")
      ?.addEventListener("click",()=>apply("en"));

    apply(saved);

    const observer=new MutationObserver(mutations=>{
      let added=false;

      for(const m of mutations){
        if(m.addedNodes && m.addedNodes.length){
          added=true;
          break;
        }
      }

      if(added){
        capture();
        const current=localStorage.getItem("zingo_language") || "ar";
        apply(current);
      }
    });

    observer.observe(document.body,{
      childList:true,
      subtree:true
    });

    window.zingoI18n={
      setLanguage:apply,
      getLanguage:()=>localStorage.getItem("zingo_language") || "ar"
    };
  }

  if(document.readyState==="loading"){
    document.addEventListener("DOMContentLoaded",init);
  }else{
    init();
  }

})();
</script>

  return fetch(path,{
    ...options,
    headers:{
      "Content-Type":"application/json",
      ...(typeof zingoAuthHeaders==="function" ? zingoAuthHeaders() : {}),
      ...(options.headers || {})
    }
  }).then(async r=>{
    const data=await r.json().catch(()=>({}));
    if(!r.ok || data.ok===false){
      throw new Error(data.error || "Request failed");
    }
    return data;
  });

        });

    });

  });

  document
    .getElementById("zingoAvatarInput")
    ?.addEventListener("change",async e=>{

      const file=e.target.files?.[0];
      if(!file) return;

      try{

        const data=await new Promise((resolve,reject)=>{

          const img=new Image();
          const reader=new FileReader();

          reader.onload=()=>{

            img.onload=()=>{

              const max=512;

              let w=img.width;
              let h=img.height;

              if(w>max || h>max){

                const scale=Math.min(
                  max/w,
                  max/h
                );

                w=Math.round(w*scale);
                h=Math.round(h*scale);

              }

              const canvas=document.createElement("canvas");

              canvas.width=w;
              canvas.height=h;

              const ctx=canvas.getContext("2d");

              if(!ctx){
                reject(new Error("Canvas unavailable"));
                return;
              }

              ctx.drawImage(
                img,
                0,
                0,
                w,
                h
              );

              resolve(
                canvas.toDataURL(
                  "image/jpeg",
                  .78
                )
              );

            };

            img.onerror=reject;
            img.src=reader.result;

          };

          reader.onerror=reject;
          reader.readAsDataURL(file);

        });

        window.__zingoProfileDraftAvatar=data;

        const preview=document.getElementById(
          "zingoAvatarPreview"
        );

        if(preview){

          if(preview.tagName==="IMG"){

            preview.src=data;

          }else{

            preview.outerHTML=`
              <img
                id="zingoAvatarPreview"
                class="zingo-avatar ${
                  String(
                    (window.__zingoState || {}).mode || "pro"
                  ).toLowerCase()==="vip"
                    ? "zingo-vip-crest"
                    : ""
                }"
                src="${esc(data)}"
                alt=""
              >
            `;

          }

        }

      }catch(err){

        console.error(
          "ZINGO AVATAR ERROR:",
          err
        );

        alert("تعذر قراءة الصورة");

      }

    });

  window.__zingoProfileDraftClub=selectedClub;

  window.__zingoProfileDraftLanguage=
    localStorage.getItem("zingo_language") || "ar";

  window.zingoSelectProfileLanguage=function(lang){

    lang=lang==="en" ? "en" : "ar";

    window.__zingoProfileDraftLanguage=lang;

    const ar=document.getElementById(
      "zingoProfileLangAR"
    );

    const en=document.getElementById(
      "zingoProfileLangEN"
    );

    if(ar){
      ar.classList.toggle(
        "primary",
        lang==="ar"
      );
    }

    if(en){
      en.classList.toggle(
        "primary",
        lang==="en"
      );
    }

  };

  window.zingoSelectProfileLanguage(
    window.__zingoProfileDraftLanguage
  );




}catch(e){
  console.error("ZINGO PROFILE EDITOR ERROR:",e);
  alert(e?.message || "تعذر فتح محرر الملف الشخصي");
  }
};

window.zingoSaveProfile=async function(){

  const input=document.getElementById(
    "zingoDisplayName"
  );

  const msg=document.getElementById(
    "zingoProfileMessage"
  );

  const name=(input?.value || "").trim();

  const avatar=
    window.__zingoProfileDraftAvatar
    || getProfile().avatar_data
    || "";

  const club=
    document.querySelector(
      "[data-club].active"
    )?.dataset.club
    || getProfile().club_id
    || "";

  if(!name){

    if(msg){
      msg.textContent=
        "اكتب اسم اللاعب أولاً";
    }

    return;
  }

  try{

    if(msg){
      msg.textContent=
        "جارٍ الحفظ...";
    }

    const result=await profileApi(
      "/api/profile/update",
      {
        method:"POST",

        body:JSON.stringify({
          display_name:name,
          avatar_data:avatar,
          club_id:club
        })
      }
    );

    window.__zingoProfile=
      result.profile || {};

    const selectedLanguage=
      window.__zingoProfileDraftLanguage==="en"
        ? "en"
        : "ar";

    localStorage.setItem(
      "zingo_language",
      selectedLanguage
    );

    window.__zingoProfileDraftAvatar="";
    window.__zingoProfileDraftClub="";
    window.__zingoProfileDraftLanguage="";

    if(
      window.zingoI18n &&
      typeof window.zingoI18n.setLanguage==="function"
    ){

      window.zingoI18n.setLanguage(
        selectedLanguage
      );

    }

    if(typeof toast==="function"){

      toast(
        "تم تحديث الملف الشخصي"
      );

    }

    if(
      window.Zingo &&
      typeof window.Zingo.go==="function"
    ){

      window.Zingo.go("profile");

    }else if(typeof render==="function"){

      render();

    }

  }catch(e){

    console.error(
      "ZINGO الملف الشخصي SAVE ERROR:",
      e
    );

    if(msg){

      msg.textContent=
        e.message ||
        "تعذر حفظ الملف الشخصي";

    }

  }

};

<script id="zingoUnified3TiersJS">

};
}

try{

{

}

<script id="zingo-master-tier-bridge">
(function(){
  "use strict";

  window.ZingoMaster = window.ZingoMaster || {};

  function telegramId(){
    try{
      return String(
        window.Telegram?.WebApp?.initDataUnsafe?.user?.id || ""
      );
    }catch(e){
      return "";
    }
  }

  async function subscription(){
    const id=telegramId();

    if(!id){
      return {
        ok:false,
        pro:{active:false},
        vip:{active:false}
      };
    }

    try{
      const r=await fetch(
        "/api/subscription?telegram_id="+encodeURIComponent(id),
        {
          cache:"no-store",
          credentials:"include"
        }
      );

      const d=await r.json();

      return {
        ok:!!d?.ok,
        pro:d?.pro || {active:false},
        vip:d?.vip || {active:false}
      };
    }catch(e){
      console.warn("Zingo subscription:",e);
      return {
        ok:false,
        pro:{active:false},
        vip:{active:false}
      };
    }
  }

  function isAdmin(){
    return telegramId()==="994708968";
  }

  async function canUse(tier){
    if(tier==="free") return true;
    if(isAdmin()) return true;

    const s=await subscription();

    if(tier==="pro") return !!s.pro?.active;
    if(tier==="vip") return !!s.vip?.active;

    return false;
  }

  async function open(tier){
    tier=String(tier||"free").toLowerCase();

    if(!(await canUse(tier))){
      const msg =
        tier==="vip"
        ? "🔒 VIP غير مفعّل حاليًا"
        : "🔒 PRO غير مفعّل حاليًا";

      if(typeof window.toast==="function"){
        window.toast(msg);
      }else{
        alert(msg);
      }

      return false;
    }

    try{
      if(tier==="vip" &&
         typeof window.startAscension==="function"){
        window.startAscension();
        return true;
      }

      if(window.Zingo &&
         typeof window.Zingo.setMode==="function"){
        window.Zingo.setMode(tier==="vip" ? "vip" : "pro");
        return true;
      }
    }catch(e){
      console.error("Zingo tier bridge:",e);
    }

    return true;
  }

  window.ZingoMaster.telegramId=telegramId;
  window.ZingoMaster.subscription=subscription;
  window.ZingoMaster.canUse=canUse;
  window.ZingoMaster.open=open;

}catch(e){
  console.error("ZINGO PROFILE EDITOR ERROR:",e);
  alert(e?.message || "تعذر فتح محرر الملف الشخصي");
}

})();
