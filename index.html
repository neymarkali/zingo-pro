<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050914">
<title>ZINGO</title>

<script src="https://telegram.org/js/telegram-web-app.js?63"></script>

<style>
:root{
  --bg:#050914;
  --card:#0c1424;
  --card2:#111c30;
  --text:#f7f9ff;
  --muted:#91a0b8;
  --line:rgba(255,255,255,.09);
  --blue:#2588ff;
  --gold:#d6a93a;
  --gold2:#ffe08a;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif
}

body{
  overflow-x:hidden
}

button,input{
  font:inherit
}

button{
  border:0
}

.app{
  max-width:760px;
  min-height:100vh;
  margin:auto;
  padding:16px 13px 100px
}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:14px
}

.brand{
  font-size:28px;
  font-weight:900;
  letter-spacing:2px
}

.mode{
  color:var(--muted);
  font-size:12px;
  padding:7px 11px;
  border:1px solid var(--line);
  border-radius:999px
}

.hero{
  padding:20px;
  border-radius:24px;
  border:1px solid var(--line);
  background:linear-gradient(145deg,#101c31,#080e19);
  margin-bottom:13px
}

.hero h1{
  margin:0 0 7px;
  font-size:24px
}

.hero p{
  margin:0;
  color:var(--muted);
  line-height:1.7
}

.tiers{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:13px
}

.tier{
  min-height:50px;
  border-radius:15px;
  background:#0b1322;
  color:#dce5f5;
  border:1px solid var(--line);
  cursor:pointer;
  font-weight:800
}

.tier.active{
  border-color:var(--blue);
  background:rgba(37,136,255,.12)
}

.vip .tier.active{
  border-color:var(--gold);
  background:rgba(214,169,58,.12)
}

.cards{
  display:grid;
  gap:12px
}

.card{
  padding:16px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px
}

.card h2{
  margin:0 0 12px;
  font-size:17px
}

.match{
  padding:13px 0;
  border-top:1px solid var(--line)
}

.match:first-child{
  border-top:0
}

.teams{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  font-weight:800
}

.league{
  margin-top:4px;
  color:var(--muted);
  font-size:12px
}

.opts{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin-top:10px
}

.opt{
  padding:10px 5px;
  border-radius:12px;
  background:var(--card2);
  color:#edf3ff;
  border:1px solid transparent;
  cursor:pointer
}

.opt.selected{
  border-color:var(--blue);
  background:rgba(37,136,255,.16)
}

.vip .opt.selected{
  border-color:var(--gold);
  background:rgba(214,169,58,.14)
}

.profile{
  display:grid;
  grid-template-columns:auto 1fr;
  gap:14px;
  align-items:center
}

.avatar{
  width:68px;
  height:68px;
  border-radius:21px;
  display:grid;
  place-items:center;
  background:linear-gradient(145deg,#1b3558,#0b1525);
  border:1px solid var(--line);
  font-size:27px;
  font-weight:900
}

.name{
  font-size:20px;
  font-weight:900
}

.meta{
  color:var(--muted);
  font-size:13px;
  line-height:1.7
}

.bar{
  height:8px;
  margin-top:9px;
  background:#172338;
  border-radius:999px;
  overflow:hidden
}

.bar i{
  display:block;
  width:42%;
  height:100%;
  background:var(--blue);
  border-radius:999px
}

.vip .bar i{
  background:linear-gradient(90deg,var(--gold),var(--gold2))
}

.actions{
  display:flex;
  gap:8px;
  margin-top:14px
}

.primary,
.secondary{
  flex:1;
  padding:12px;
  border-radius:13px;
  cursor:pointer;
  font-weight:800
}

.primary{
  color:white;
  background:var(--blue)
}

.vip .primary{
  color:#111;
  background:linear-gradient(135deg,#9b7417,#f0cf68)
}

.secondary{
  color:white;
  background:#121d30;
  border:1px solid var(--line)
}

.notice{
  margin-top:12px;
  padding:11px;
  border-radius:13px;
  color:#b9f7df;
  background:rgba(52,211,153,.08);
  border:1px solid rgba(52,211,153,.2);
  font-size:13px
}

.bottom{
  position:fixed;
  left:50%;
  bottom:10px;
  transform:translateX(-50%);
  width:min(740px,calc(100% - 14px));
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:5px;
  padding:7px;
  background:rgba(8,14,25,.95);
  border:1px solid var(--line);
  border-radius:19px;
  backdrop-filter:blur(16px);
  z-index:20
}

.nav{
  min-height:44px;
  padding:7px 3px;
  border-radius:13px;
  background:transparent;
  color:var(--muted);
  cursor:pointer;
  font-size:11px
}

.nav.active{
  color:#fff;
  background:rgba(255,255,255,.07)
}

@media(max-width:430px){
  .app{padding-inline:10px}
  .hero h1{font-size:22px}
  .bottom{width:calc(100% - 10px)}
}
</style>
</head>

<body>

<main class="app">

<header class="top">
  <div class="brand">ZINGO</div>
  <div class="mode" id="modeLabel">مجاني</div>
</header>

<section class="hero">
  <h1 id="heroTitle">واجهة التوقعات</h1>
  <p id="heroText">اختر الواجهة وابدأ التوقعات مباشرة.</p>
</section>

<section class="tiers">
  <button class="tier active" data-tier="free">مجاني</button>
  <button class="tier" data-tier="pro">احترافي</button>
  <button class="tier" data-tier="vip">ملكي</button>
</section>

<section class="cards" id="content"></section>

<nav class="bottom">
  <button class="nav active" data-page="home">الرئيسية</button>
  <button class="nav" data-page="matches">المباريات</button>
  <button class="nav" data-page="predictions">التوقعات</button>
  <button class="nav" data-page="stats">الإحصائيات</button>
  <button class="nav" data-page="profile">الملف الشخصي</button>
</nav>

</main>

<script>
(function(){

"use strict";

var tg=window.Telegram&&window.Telegram.WebApp;

if(tg){
  try{tg.ready()}catch(e){}
  try{tg.expand()}catch(e){}
  try{
    if(tg.disableVerticalSwipes) tg.disableVerticalSwipes();
  }catch(e){}
}

var state={
  tier:"free",
  page:"home",
  name:"لاعب جديد",
  points:0,
  level:1,
  picks:{}
};

var matches=[
  {
    id:1,
    league:"الدوري الإنجليزي",
    a:"ليفربول",
    b:"تشيلسي"
  },
  {
    id:2,
    league:"الدوري الإسباني",
    a:"ريال مدريد",
    b:"برشلونة"
  },
  {
    id:3,
    league:"الدوري الإيطالي",
    a:"إنتر",
    b:"ميلان"
  }
];

function $(id){
  return document.getElementById(id);
}

function safe(s){
  return String(s).replace(/[&<>"']/g,function(x){
    return {
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[x];
  });
}

function tierName(){
  if(state.tier==="pro") return "احترافي";
  if(state.tier==="vip") return "ملكي";
  return "مجاني";
}

function save(){
  try{
    localStorage.setItem(
      "zingo_clean_3tiers",
      JSON.stringify(state)
    );
  }catch(e){}
}

function load(){
  try{
    var x=JSON.parse(
      localStorage.getItem("zingo_clean_3tiers")||"null"
    );

    if(!x) return;

    if(["free","pro","vip"].includes(x.tier))
      state.tier=x.tier;

    if([
      "home",
      "matches",
      "predictions",
      "stats",
      "profile"
    ].includes(x.page))
      state.page=x.page;

    if(typeof x.name==="string"&&x.name)
      state.name=x.name;

    if(Number.isFinite(x.points))
      state.points=x.points;

    if(Number.isFinite(x.level))
      state.level=x.level;

    if(x.picks&&typeof x.picks==="object")
      state.picks=x.picks;

  }catch(e){}
}

function render(){

  document.body.classList.toggle(
    "vip",
    state.tier==="vip"
  );

  $("modeLabel").textContent=tierName();

  document.querySelectorAll(".tier").forEach(function(b){
    b.classList.toggle(
      "active",
      b.dataset.tier===state.tier
    );
  });

  document.querySelectorAll(".nav").forEach(function(b){
    b.classList.toggle(
      "active",
      b.dataset.page===state.page
    );
  });

  $("heroTitle").textContent=
    state.tier==="vip"
      ? "الواجهة الملكية"
      : state.tier==="pro"
        ? "الواجهة الاحترافية"
        : "واجهة التوقعات";

  $("heroText").textContent=
    state.tier==="vip"
      ? "توقعات متقدمة مع خيارات إضافية وهوية ملكية."
      : state.tier==="pro"
        ? "توقعات احترافية مع خيارات وتحليلات أوسع."
        : "واجهة بسيطة وسريعة للتوقعات الأساسية.";

  var c=$("content");

  if(state.page==="profile"){

    c.innerHTML=
      '<section class="card">'+
        '<div class="profile">'+
          '<div class="avatar">'+
            safe((state.name.trim()[0]||"ز"))+
          '</div>'+
          '<div>'+
            '<div class="name">'+safe(state.name)+'</div>'+
            '<div class="meta">'+
              'المستوى '+state.level+
              ' • '+state.points+
              ' نقطة • '+tierName()+
            '</div>'+
            '<div class="bar"><i></i></div>'+
          '</div>'+
        '</div>'+
        '<div class="actions">'+
          '<button class="primary" id="editName">تعديل الاسم</button>'+
          '<button class="secondary" id="resetData">إعادة البيانات</button>'+
        '</div>'+
      '</section>'+
      '<section class="card">'+
        '<h2>هوية الحساب</h2>'+
        '<div class="meta">'+
          'المجاني: اسم وحرف فقط • '+
          'الاحترافي: شعار نادي وإحصائيات • '+
          'الملكي: هوية وإطارات متقدمة.'+
        '</div>'+
      '</section>';

    $("editName").onclick=function(){

      var n=prompt(
        "اكتب اسمك",
        state.name
      );

      if(n&&n.trim()){
        state.name=n.trim();
        save();
        render();
      }

    };

    $("resetData").onclick=function(){
      state.points=0;
      state.level=1;
      state.picks={};
      save();
      render();
    };

    return;
  }

  if(state.page==="stats"){

    c.innerHTML=
      '<section class="card">'+
        '<h2>الإحصائيات</h2>'+
        '<div class="profile">'+
          '<div class="avatar">'+
            state.points+
          '</div>'+
          '<div>'+
            '<div class="name">'+
              state.points+' نقطة'+
            '</div>'+
            '<div class="meta">'+
              'المستوى الحالي '+state.level+
            '</div>'+
            '<div class="bar">'+
              '<i style="width:'+Math.min(
                100,
                state.points%100
              )+'%"></i>'+
            '</div>'+
          '</div>'+
        '</div>'+
      '</section>'+
      '<section class="card">'+
        '<h2>نظام النقاط</h2>'+
        '<div class="meta">'+
          'النتيجة الصحيحة: نقطتان • '+
          'الخيارات الإضافية حسب الواجهة.'+
        '</div>'+
      '</section>';

    return;
  }

  if(state.page==="predictions"){

    var keys=Object.keys(state.picks);

    c.innerHTML=
      '<section class="card">'+
        '<h2>توقعاتي</h2>'+
        '<div id="savedList"></div>'+
      '</section>';

    if(!keys.length){
      $("savedList").innerHTML=
        '<div class="meta">لم تحفظ أي توقع بعد.</div>';
    }else{

      $("savedList").innerHTML=
        keys.map(function(k){

          var p=state.picks[k];

          return(
            '<div class="match">'+
              '<div class="teams">'+
                '<span>'+safe(p.a)+'</span>'+
                '<span>'+safe(p.pick)+'</span>'+
                '<span>'+safe(p.b)+'</span>'+
              '</div>'+
            '</div>'
          );

        }).join("");
    }

    return;
  }

  var html=
    '<section class="card">'+
      '<h2>مباريات اليوم</h2>';

  matches.forEach(function(m){

    html+=
      '<div class="match">'+
        '<div class="teams">'+
          '<span>'+safe(m.a)+'</span>'+
          '<span>ضد</span>'+
          '<span>'+safe(m.b)+'</span>'+
        '</div>'+
        '<div class="league">'+
          safe(m.league)+
        '</div>'+
        '<div class="opts">';

    [
      ["فوز الأول","1"],
      ["تعادل","X"],
      ["فوز الثاني","2"]
    ].forEach(function(o){

      var selected=
        state.picks[m.id] &&
        state.picks[m.id].pick===o[1];

      html+=
        '<button class="opt'+
        (selected?" selected":"")+
        '" data-match="'+m.id+
        '" data-pick="'+o[1]+'">'+
        o[0]+
        '</button>';

    });

    html+='</div>';

    if(state.tier!=="free"){

      html+=
        '<div class="opts">'+
          '<button class="opt">كلاهما يسجل</button>'+
          '<button class="opt">فوق 2.5</button>';

      if(state.tier==="vip"){
        html+=
          '<button class="opt">الركنيات</button>';
      }

      html+='</div>';
    }

    html+='</div>';
  });

  html+=
      '<div class="notice">'+
        'الواجهة الجديدة خفيفة ومستقلة، '+
        'ويمكن ربطها لاحقاً ببيانات البوت الحقيقية.'+
      '</div>'+
    '</section>';

  c.innerHTML=html;

  c.querySelectorAll(
    "[data-match][data-pick]"
  ).forEach(function(b){

    b.onclick=function(){

      var id=b.dataset.match;

      var m=matches.find(function(x){
        return String(x.id)===id;
      });

      if(!m) return;

      state.picks[id]={
        a:m.a,
        b:m.b,
        pick:b.dataset.pick
      };

      state.points++;

      if(state.points>=100)
        state.level=2;

      save();
      render();
    };

  });
}

document.querySelectorAll(".tier").forEach(function(b){

  b.onclick=function(){

    state.tier=b.dataset.tier;
    state.page="home";

    save();
    render();
  };

});

document.querySelectorAll(".nav").forEach(function(b){

  b.onclick=function(){

    state.page=b.dataset.page;

    save();
    render();
  };

});

load();
render();

})();
</script>

</body>
</html>
